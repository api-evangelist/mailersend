name: MailerSend
kind: company
description: >-
  MailerSend is a transactional email and SMS platform built for developers. Its v1 REST API covers email
  sending (single, bulk to 500 objects per request, and scheduled up to 72 hours out), SMTP relay,
  templates, sending domains and DNS verification, sender identities, recipients and five suppression
  lists, inbound routing, activity and analytics, email verification, DMARC and blocklist monitoring, SMS,
  and account/token administration. Authentication is a domain-scoped bearer token drawn from a 30-value
  scope vocabulary. MailerSend ships six official SDKs, an official Laravel driver, a Go CLI with an
  interactive TUI, a remote OAuth-protected MCP server exposing 127 tools, and its own published Agent
  Skill — but no machine-readable API contract and no idempotency guarantee.
