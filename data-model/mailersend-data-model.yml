notes: >-
  Entity graph derived from the captured OpenAPI plus MailerSend's documented resource surface. The
  domain is the organising root of the whole model: API tokens, sender identities, SMTP users, templates,
  webhooks, inbound routes and suppression lists all hang off a sending domain, which is why a
  domain-scoped token is MailerSend's permission boundary rather than an account-wide key.
