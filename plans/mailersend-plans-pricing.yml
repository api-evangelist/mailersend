provider: MailerSend
providerId: mailersend
created: '2026-05-08'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://developers.mailersend.com/general
reconciled: partial
tags:
  - Email
  - Transactional
  - SMS
  - Templates
  - API
  - Plans
description: >-
  MailerSend sells five named tiers — Trial, Hobby, Starter, Professional and Enterprise. The tier names
  and the per-plan daily API request quota attached to each are published in MailerSend's developer
  documentation and are captured verbatim below. The monetary prices and email-volume allowances are NOT
  captured: they live only on https://www.mailersend.com/pricing, which sits behind a Cloudflare bot
  challenge that returned HTTP 429 with a "Just a moment..." interstitial to every automated request in
  this pass (2026-08-13), including /robots.txt on that host.
notes: >-
  This is a partial reconciliation, deliberately. Plan names and quota limits are provider-published and
  verified; prices are recorded as unknown rather than sourced second-hand, because a price that is not
  read from the provider's own page is not evidence. Re-run against www.mailersend.com/pricing when that
  host is reachable.
sources:
  - https://developers.mailersend.com/general
  - https://www.mailersend.com/pricing
unreadable_sources:
  - url: https://www.mailersend.com/pricing
    status: 429
    reason: Cloudflare bot challenge ("Just a moment...") on every automated request.
plan_count: 5
currency: unknown
plans:
  - id: trial
    name: Trial
    type: free
    price: unknown
    description: >-
      Free entry tier. Sending is restricted to a MailerSend trial domain with its own email quota and a
      cap on unique recipients (errors MS42222, MS42225).
    entries:
      - label: Daily API request quota
        name: api_requests_per_day
        type: quota
        metric: requests
        limit: 100
        timeFrame: day
        unit: 1
  - id: hobby
    name: Hobby
    type: paid
    price: unknown
    description: >-
      First paid tier. Some product features are gated at Hobby or higher (error MS42216 — "This feature
      requires a Hobby plan or higher").
    entries:
      - label: Daily API request quota
        name: api_requests_per_day
        type: quota
        metric: requests
        limit: 1000
        timeFrame: day
        unit: 1
  - id: starter
    name: Starter
    type: paid
    price: unknown
    description: >-
      Starter and above may add a from address as a verified sender identity rather than verifying a whole
      sending domain.
    entries:
      - label: Daily API request quota
        name: api_requests_per_day
        type: quota
        metric: requests
        limit: 100000
        timeFrame: day
        unit: 1
  - id: professional
    name: Professional
    type: paid
    price: unknown
    description: MailerSend directs customers needing more API throughput to the Professional plan.
    entries:
      - label: Daily API request quota
        name: api_requests_per_day
        type: quota
        metric: requests
        limit: 500000
        timeFrame: day
        unit: 1
  - id: enterprise
    name: Enterprise
    type: enterprise
    price: unknown
    entries:
      - label: Daily API request quota
        name: api_requests_per_day
        type: quota
        metric: requests
        limit: 500000
        timeFrame: day
        unit: 1
cross_plan_limits:
  - name: Recipients per email object (approved accounts)
    value: 50 TO, 10 CC, 10 BCC
    source: https://developers.mailersend.com/general
  - name: Recipients per email object (unapproved accounts)
    value: 10 TO, 1 CC, 1 BCC
    source: https://developers.mailersend.com/general
  - name: Bulk email objects per request
    value: 500
    source: https://developers.mailersend.com/general
  - name: Attachment size
    value: 25 MB
    source: https://developers.mailersend.com/general
  - name: Scheduled send horizon
    value: 72 hours
    source: https://developers.mailersend.com/general
