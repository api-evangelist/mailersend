notes: 'MailerSend does not use RFC 9457 application/problem+json. Errors are returned as plain application/json.
  Validation failures (422) use an envelope of {"message": ..., "errors": {"<field>": ["<message> #MS4xxxx"]}} —
  the machine-readable code is the #MS-prefixed token appended to the human message string, not a discrete field.
  Business errors carry the same #MS code inside "message".'
envelope:
  generic:
    fields:
    - message
    example:
      message: 'Your account reached its rate limit of 120 requests/min. Please wait before trying again. #MS42903'
  validation:
    status: 422
    fields:
    - message
    - errors
    example:
      message: The given data was invalid.
      errors:
        from.email:
        - 'The from.email domain must be verified in your account to send emails. #MS42207'
  code_location: suffix "#MS<code>" appended to the message string
