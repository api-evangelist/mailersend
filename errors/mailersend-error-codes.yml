sms_delivery_codes:
- code: 4001
  slug: service-not-allowed
  friendly: Message was rejected for reasons other than those covered by other 4xxx codes
  explanation: This is a general error that the service you are attempting to use is not allowed; you may have inaccurate
    permissions, formatting or may not be enable to use that service.
  billable: false
- code: 4301
  slug: malformed-invalid-encoding
  friendly: Malformed message encoding
  explanation: The message contains invalid characters that are not supported. MailerSend cannot re-encode message
    for destination.
  billable: false
- code: 4302
  slug: malformed-invalid-from-number
  friendly: Malformed From number
  explanation: 'The From number associated with the message is a number not routable to a carrier or valid in the
    industry (Ex: a 9 digit number).'
  billable: false
- code: 4303
  slug: malformed-invalid-to-number
  friendly: Malformed To Number
  explanation: 'The To number associated with the message is a number not routable to a carrier or valid in the
    industry (Ex: a 9 digit number).'
  billable: false
- code: 4350
  slug: malformed-for-destination
  friendly: Malformed message encoding
  explanation: Message passed validation on receive stage, but failed on send. This is likely because the destination
    number (To) is an invalid number.
  billable: false
- code: 4360
  slug: message-not-sent-expiration-date-passed
  friendly: Message expired
  explanation: Message was not sent because the specified expiration date passed before the message was able to
    send
  billable: false
- code: 4401
  slug: rejected-routing-error
  friendly: BW is unable to route the message
  explanation: Message is unable to be routed within MailerSend particularly when the source and destination are
    the same number. The destination or To number is mis-provisioned or there is a configuration with the message
    that is causing a situation where a message is being sent repeatedly between the same numbers.
  billable: false
- code: 4403
  slug: rejected-forbidden-from-number
  friendly: Messaging forbidden on From number
  explanation: 'Messaging on this From number is forbidden most commonly because the number does not belong to MailerSend
    or the account. Other reasons include: the TN is not enabled in the MailerSend Dashboard, the account associated
    with this number is not enabled for this type of messaging, the TN is disconnected, or it is an invalid number
    (i.e., 11111111111).'
  billable: false
- code: 4404
  slug: rejected-forbidden-to-number
  friendly: Messaging forbidden on To number
  explanation: Messaging on this To number is forbidden. This could be the number is not active, not enabled for
    messaging or is an invalid number (i.e. 11111111111)
  billable: false
- code: 4405
  slug: rejected-unallocated-from-number
  friendly: Unallocated from number
  explanation: The From telephone number is considered unallocated when the number does not exist in our database
    as an active number. This number is either not enabled for messaging at the industry level, or the number is
    not yet released in the industry
  billable: false
- code: 4406
  slug: rejected-unallocated-to-number
  friendly: Unallocated to number
  explanation: The To number associated with this message, while a valid North American number, is not yet assigned
    to a carrier and the message cannot be sent downstream.
  billable: false
- code: 4407
  slug: rejected-account-not-defined-from-number
