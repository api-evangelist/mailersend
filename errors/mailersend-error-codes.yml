notes: 'Two distinct registries. `api_error_codes` are MailerSend''s own #MS-prefixed application codes returned
  inside the JSON error message on the REST API. `sms_delivery_codes` are the numeric downstream-carrier delivery-failure
  codes reported on SMS messages (the SMS analogue of a payments decline-code table), including whether each failure
  is billable.'
api_error_codes:
