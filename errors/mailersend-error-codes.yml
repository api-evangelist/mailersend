- code: MS42901
  message: Your account reached its API daily quota limit. Upgrade to increase it.
  explanation: 'The account making the request reached its API daily quota limit. Upgrade to raise your quota.Every
    request is counted against the quota and the quota is reset daily at midnight UTC.Trial plan accounts have a
    daily limit of 100 API requests. Hobby plan accounts are limited to 1,000 daily requests. Starter plan accounts
    can send up to 100,000 daily requests, and Professional or Enterprise plan accounts can send up to 500,000 requests.See
    more information about quotas and learn how to avoid this error: Daily request quota'
- code: MS42903
